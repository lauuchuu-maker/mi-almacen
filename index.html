<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Gestión Completo</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .formulario { background: white; padding: 15px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        table { width: 100%; border-collapse: collapse; background: white; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f8f9fa; }
        .panel { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
        .seccion { flex: 1; background: white; padding: 20px; border-radius: 8px; border: 1px solid #ddd; min-width: 300px; }
        button { padding: 8px 15px; cursor: pointer; color: white; border: none; border-radius: 4px; margin: 2px; }
        .btn-add { background-color: #4CAF50; }
        .btn-confirm { background-color: #FF9800; }
        .btn-cerrar { background-color: #d32f2f; }
        .btn-edit { background-color: #2196F3; }
        .btn-remove { background-color: #f44336; }
        input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        .lista-scroll { max-height: 150px; overflow-y: auto; background: #fafafa; padding: 10px; list-style: none; }
        .lista-scroll li { margin-bottom: 8px; display: flex; justify-content: space-between; border-bottom: 1px dashed #ddd; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

    <h2>Gestión de Almacén</h2>
    
    <div class="formulario">
        <input type="text" id="busqueda" placeholder="Buscar producto..." onkeyup="renderizar()">
    </div>
    
    <div class="formulario">
        <input type="text" id="prod" placeholder="Nombre">
        <input type="number" id="costo" placeholder="Costo ($)" style="width: 90px;">
        <input type="number" id="stock" placeholder="Stock" style="width: 70px;">
        <input type="number" id="porcentaje" value="30" style="width: 60px;" placeholder="%">
        <input type="file" id="fotoInput" accept="image/*">
        <button class="btn-add" onclick="agregar()">Agregar Producto</button>
    </div>

    <table id="tablaInventario">
        <thead>
            <tr>
                <th>Foto</th><th>Producto</th><th>Costo</th><th>%</th><th>Precio Venta</th><th>Stock</th><th>Acciones</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
    </table>

    <div class="panel">
        <div class="seccion">
            <h3>Carrito Actual</h3>
            <ul id="listaCarrito"></ul>
            <p><strong>Total: $<span id="totalCarrito">0.00</span></strong></p>
            <button class="btn-confirm" onclick="confirmarVenta()">Confirmar Venta</button>
        </div>
        
        <div class="seccion">
            <h3>Balance</h3>
            <p>Recaudado Hoy: <strong id="recaudadoHoy">$0.00</strong></p>
            <p style="color: green;"><strong>Ganancia Hoy: <span id="gananciaHoy">$0.00</span></strong></p>
            <hr>
            <p>Recaudado Mes: <strong id="totalMes">$0.00</strong></p>
            <p style="color: green;"><strong>Ganancia Mes: <span id="gananciaMes">$0.00</span></strong></p>
            <button class="btn-cerrar" onclick="cerrarDia()">Cerrar Día</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA2k6dGz5LHnyW_RnzZNQQbdsYsOtKGBFM", databaseURL: "https://mi-almacen-be016-default-rtdb.firebaseio.com", projectId: "mi-almacen-be016" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let inventario = [], ventasHoy = [], historial = [], carrito = [];

        db.ref('almacen').on('value', s => { inventario = s.val() || []; renderizar(); });
        db.ref('ventasHoy').on('value', s => { ventasHoy = s.val() || []; actualizarBalance(); });
        db.ref('historial').on('value', s => { historial = s.val() || []; actualizarBalance(); });

        function renderizar() {
            let tbody = document.getElementById('cuerpoTabla');
            tbody.innerHTML = '';
            inventario.forEach((item, i) => {
                let precioVenta = (parseFloat(item.costo) * (1 + parseFloat(item.porcentaje) / 100));
                tbody.innerHTML += `<tr>
                    <td>${item.foto ? `<img src="${item.foto}" width="40">` : "-"}</td>
                    <td>${item.nombre}</td>
                    <td>$${parseFloat(item.costo).toFixed(2)}</td>
                    <td>${item.porcentaje}%</td>
                    <td><strong>$${precioVenta.toFixed(2)}</strong></td>
                    <td>${item.stock}</td>
                    <td><button class="btn-add" onclick="agregarAlCarrito(${i})">Agregar</button></td>
                </tr>`;
            });
        }

        function agregarAlCarrito(index) {
            let prod = inventario[index];
            let precioVenta = (parseFloat(prod.costo) * (1 + parseFloat(prod.porcentaje) / 100));
            carrito.push({ index, nombre: prod.nombre, costo: prod.costo, precio: precioVenta });
            actualizarCarrito();
        }

        function actualizarCarrito() {
            let lista = document.getElementById('listaCarrito');
            let total = 0;
            lista.innerHTML = "";
            carrito.forEach((item, i) => {
                lista.innerHTML += `<li>${item.nombre} - $${item.precio.toFixed(2)}</li>`;
                total += item.precio;
            });
            document.getElementById('totalCarrito').innerText = total.toFixed(2);
        }

        function confirmarVenta() {
            carrito.forEach(item => {
                inventario[item.index].stock--;
                ventasHoy.push({ total: item.precio, costo: item.costo });
            });
            db.ref('almacen').set(inventario);
            db.ref('ventasHoy').set(ventasHoy);
            carrito = [];
            actualizarCarrito();
        }

        function cerrarDia() {
            let totalDia = ventasHoy.reduce((a, b) => a + b.total, 0);
            let costoDia = ventasHoy.reduce((a, b) => a + b.costo, 0);
            historial.push({ fecha: new Date().toLocaleDateString(), total: totalDia, costo: costoDia });
            db.ref('historial').set(historial);
            db.ref('ventasHoy').remove();
            ventasHoy = [];
        }

        function actualizarBalance() {
            let tHoy = ventasHoy.reduce((a, b) => a + b.total, 0);
            let cHoy = ventasHoy.reduce((a, b) => a + b.costo, 0);
            document.getElementById('recaudadoHoy').innerText = "$" + tHoy.toFixed(2);
            document.getElementById('gananciaHoy').innerText = "$" + (tHoy - cHoy).toFixed(2);

            let tMes = historial.reduce((a, b) => a + b.total, 0);
            let cMes = historial.reduce((a, b) => a + b.costo, 0);
            document.getElementById('totalMes').innerText = "$" + tMes.toFixed(2);
            document.getElementById('gananciaMes').innerText = "$" + (tMes - cMes).toFixed(2);
        }

        function agregar() { /* Mantén tu lógica original aquí */ }
    </script>
</body>
</html>
