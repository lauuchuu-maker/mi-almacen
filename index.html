<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Almacén</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        .hidden-app { display: none; }
        .error-msg { color: red; font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body class="bg-gray-100 font-sans p-4">

    <!-- Pantalla de Login -->
    <div id="loginScreen" class="flex justify-center items-center h-screen">
        <div class="bg-white p-8 rounded shadow-md w-80">
            <h2 class="text-xl mb-4 font-bold">Iniciar Sesión</h2>
            <input type="email" id="email" placeholder="Correo" class="border p-2 w-full mb-2 rounded">
            <input type="password" id="password" placeholder="Contraseña" class="border p-2 w-full mb-4 rounded">
            <button onclick="login()" class="bg-blue-500 text-white w-full p-2 rounded hover:bg-blue-600">Entrar</button>
            <div id="loginError" class="error-msg text-center font-semibold"></div>
        </div>
    </div>

    <!-- Aplicación Principal -->
    <div id="app" class="hidden-app">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Gestión de Almacén (Conectado)</h2>
        <h2 class="text-2xl font-bold">Gestión de Almacén</h2>
        <button onclick="logout()" class="bg-gray-500 text-white px-4 py-2 rounded">Cerrar Sesión</button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Inventario -->
            <div class="bg-white p-4 rounded shadow">
                <input type="text" id="busqueda" placeholder="Buscar producto..." onkeyup="renderizar()" class="border p-2 w-full mb-4">
                <table class="w-full border-collapse">
                    <thead><tr class="bg-gray-100"><th>Producto</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr></thead>
                    <tbody id="cuerpoTabla"></tbody>
                </table>
            </div>

            <!-- Panel de Ventas y Balance -->
            <div class="bg-white p-4 rounded shadow">
                <h3 class="font-bold mb-2">Carrito Actual</h3>
                <ul id="listaCarrito" class="mb-4"></ul>
                <button onclick="confirmarVenta()" class="bg-green-500 text-white px-4 py-2 rounded">Confirmar Venta</button>

                <div class="mt-6 border-t pt-4">
                    <h3 class="font-bold">Balance</h3>
                    <p>Hoy: <strong id="recaudadoHoy">$0.00</strong> | Ganancia: <strong id="gananciaHoy" class="text-green-600">$0.00</strong></p>
                    <button onclick="cerrarDia()" class="bg-red-600 text-white px-4 py-2 mt-2 rounded">Cerrar Día</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2k6dGz5LHnyW_RnzZNQQbdsYsOtKGBFM",
            authDomain: "mi-almacen-be016.firebaseapp.com",
            databaseURL: "https://mi-almacen-be016-default-rtdb.firebaseio.com",
            projectId: "mi-almacen-be016",
            storageBucket: "mi-almacen-be016.firebasestorage.app",
            messagingSenderId: "180812846512",
            appId: "1:180812846512:web:86e11643678392a9be7275"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // UI Feedback for Login
        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            
            errorDiv.innerText = "Conectando...";
            
            auth.signInWithEmailAndPassword(email, pass)
                .catch(e => {
                    errorDiv.innerText = "Error: " + e.message;
                });
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('loginScreen').classList.add('hidden-app');
                document.getElementById('app').classList.remove('hidden-app');
            } else {
                document.getElementById('loginScreen').classList.remove('hidden-app');
                document.getElementById('app').classList.add('hidden-app');
            }
        });

        function logout() { auth.signOut(); }
        // ... rest of your existing functions ...
    </script>
</body>
</html>
